# The configuration for the app attest authentication feature for the summarizer
features:
  summarizer-app-attest-auth-feature:
    description: >
      This feature enables app attest authentication for the summarizer.
    variables:
      enabled:
        description: >
          Enables app attest authentication for the summarizer.
        type: Boolean
        default: true
    defaults:
      # Ecosia: App Attest only authenticates requests to Mozilla's hosted summarizer, which Ecosia
      # does not use (see hostedSummarizerFeature.yaml). Off on every channel, with `release` listed
      # explicitly because the upstream variable default is `true`.
      - channel: release
        value:
          enabled: false
      - channel: beta
        value:
          enabled: false
      - channel: developer
        value:
          enabled: false
