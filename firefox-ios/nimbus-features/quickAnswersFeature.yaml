# The configuration for the quickAnswersFeature feature
features:
  quick-answers-feature:
    description: >
      The feature flag to manage the roll out of the quick answers feature.
    variables:
      enabled:
        description: >
          Enables the feature.
        type: Boolean
        default: false
      model:
        description: >
          Which provider model backs Quick Answers.
        type: QuickAnswersModel
        default: exa
    defaults:
      # Ecosia: Quick Answers (voice questions answered by Mozilla's AI providers) is not part of the
      # Ecosia product; off on every channel, with `release` listed explicitly rather than inheriting
      # the upstream variable default.
      - channel: release
        value:
          enabled: false
          model: exa
      - channel: beta
        value:
          enabled: false
          model: exa
      - channel: developer
        value:
          enabled: false
          model: exa

enums:
  QuickAnswersModel:
    description: The provider model that backs the Quick Answers feature.
    variants:
      exa:
        description: The Exa model provider.
      liner:
        description: The Liner model provider.
