# The configuration for the reportBrokenSiteFeature feature
features:
  report-broken-site-feature:
    description: >
      In-app Report Broken Site (WebCompat) reporter
    variables:
      enabled:
        description: >
          Whether or not this feature is enabled
        type: Boolean
        default: true
    defaults:
      # Ecosia: Report Broken Site is off on every channel, with `release` listed explicitly. The report is a
      # Glean ping to Mozilla (`WebCompatReportRecorder`), and Ecosia's Glean never uploads, so the row would
      # send nothing (inventory 159.1, MOB-5043).
      - channel: release
        value:
          enabled: false
      - channel: beta
        value:
          enabled: false
      - channel: developer
        value:
          enabled: false
