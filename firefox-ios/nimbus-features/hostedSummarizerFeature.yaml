# The configuration for the hosted summarizer feature
features:
  hosted-summarizer-feature:
    description: >
      This feature enables the hosted summarizer feature.
    variables:
      enabled:
        description: >
          Enables the hosted summarizer feature.
        type: Boolean
        default: false
      toolbarEntrypoint:
        description: >
          Enables the toolbar entrypoint for the summarizer feature.
        type: Boolean
        default: false
      shakeGesture:
        description: >
          Enables the shake gesture for the summarizer feature.
        type: Boolean
        default: false
    defaults:
      # Ecosia: Summaries run on-device only (Apple Intelligence), so no page content is ever sent
      # to Mozilla's hosted summarizer. Off on every channel, with `release` listed explicitly rather
      # than inheriting the upstream variable default. `isHostedSummarizerEnabled()` in
      # `SummarizerNimbusUtils` is also overridden to return false.
      - channel: release
        value:
          enabled: false
          toolbarEntrypoint: false
          shakeGesture: false
      - channel: beta
        value:
          enabled: false
          toolbarEntrypoint: false
          shakeGesture: false
      - channel: developer
        value:
          enabled: false
          toolbarEntrypoint: false
          shakeGesture: false
