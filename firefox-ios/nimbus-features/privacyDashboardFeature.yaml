# The configuration for the privacyDashboardFeature feature
features:
  privacy-dashboard-feature:
    description: >
      The Privacy Dashboard feature from homepage
    variables:
      enabled:
        description: >
          Whether or not this feature is enabled
        type: Boolean
        default: false
    defaults:
      # Ecosia: The homepage privacy dashboard is off on every channel, with `release` listed explicitly.
      # Ecosia's homepage has its own impact and privacy content (inventory 159.1, MOB-5043).
      - channel: release
        value:
          enabled: false
      - channel: beta
        value:
          enabled: false
      - channel: developer
        value:
          enabled: false