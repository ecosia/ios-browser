# The configuration for the adBlocker feature
features:
  ad-blocker-feature:
    description: >
      The feature flag to manage the roll out of the Ad Blocker badge in the
      Site Menu and the corresponding Block Ads toggle in Browsing settings.
    variables:
      enabled:
        description: >
          Whether or not this feature is enabled
        type: Boolean
        default: false
      badge-enabled:
        description: >
          Whether or not the Ad Blocker badge is shown in the Site Menu
        type: Boolean
        default: false
    defaults:
      # Ecosia: The ad blocker is off for now: its EasyList-based block list hides the ads on
      # Ecosia's own search results, which fund tree planting. Both the Block Ads toggle and the
      # Site Menu badge are off on every channel, with `release` listed explicitly. While the flag
      # is off, `ContentBlocker.reloadAdBlockerList()` also skips downloading and compiling the
      # list. Whether it can come back is investigated in MOB-5052 (upgrade ticket 26).
      - channel: release
        value:
          enabled: false
          badge-enabled: false
      - channel: beta
        value:
          enabled: false
          badge-enabled: false
      - channel: developer
        value:
          enabled: false
          badge-enabled: false
