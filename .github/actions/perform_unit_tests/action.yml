name: 'Perform Unit Tests'
description: 'This action contains all the usual steps needed to perform the unit tests'

inputs:
  github-token:
    description: 'The Github Token'
    required: true

runs:
  using: "composite"
  steps:

    - name: Install xcpretty and prepare output directory
      shell: bash
      run: |
        gem install xcpretty
        mkdir -p test_output/xml

    - name: Run tests with xcodebuild and xcpretty
      shell: bash
      run: |
        set -o pipefail && xcodebuild -scheme Ecosia \
          -project firefox-ios/Client.xcodeproj \
          -configuration Testing \
          -enableCodeCoverage NO \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -clonedSourcePackagesDirPath firefox-ios/SourcePackages \
          -derivedDataPath DerivedData \
          build-for-testing | tee raw_build_for_testing.log | xcpretty --color

        set +e
        set -o pipefail && xcodebuild -scheme Ecosia \
          -project firefox-ios/Client.xcodeproj \
          -configuration Testing \
          -enableCodeCoverage NO \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -resultBundlePath TestResults.xcresult \
          -derivedDataPath DerivedData \
          test-without-building | xcpretty --color --report junit --output test_output/xml/report.junit
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        set -e
        echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

    - name: Upload raw build-for-testing log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raw-build-for-testing-log
        path: raw_build_for_testing.log

    # Ecosia (MOB-4384): Xcode drops dynamic SPM package products from app-hosted .xctest link
    # lines, so test code calling that API directly fails to link on CI. xcodebuild stops at the
    # first failing target, which otherwise reveals only one affected target per run — this report
    # lists every one of them from a single build. See TestTargets.ForceLinkedPackageProduct.
    - name: Report test target package product linkage
      if: always()
      shell: bash
      run: |
        # pipefail so the check's exit status survives the tee — without it this step always passes.
        set -o pipefail
        python3 .github/scripts/report_test_target_linkage.py \
          raw_build_for_testing.log \
          firefox-ios/Client.xcodeproj/project.pbxproj \
          | tee test_target_linkage.log

    - name: Upload test target linkage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-target-linkage-report
        path: test_target_linkage.log

    - name: Inspect Shared/Storage/Client symbol exports
      if: always()
      shell: bash
      run: |
        set +e
        PATTERN='6SharedE3now|5MaybeO|7succeedAA8DeferredC|10deferMaybe|6CGRectV6SharedE4size'
        SHARED_BIN=$(find DerivedData/Build/Products/Testing-iphonesimulator/PackageFrameworks -name "Shared_*_PackageProduct" -type f 2>/dev/null | head -1)
        STORAGE_BIN="DerivedData/Build/Products/Testing-iphonesimulator/Storage.framework/Storage"
        CLIENT_DYLIB="DerivedData/Build/Products/Testing-iphonesimulator/Client.app/Client.debug.dylib"

        {
          echo "=== Shared binary: ${SHARED_BIN:-NOT FOUND} ==="
          [ -n "$SHARED_BIN" ] && [ -f "$SHARED_BIN" ] && nm -gU "$SHARED_BIN" | grep -E "$PATTERN"
          echo ""
          echo "=== Storage binary: $STORAGE_BIN ==="
          [ -f "$STORAGE_BIN" ] && nm -gU "$STORAGE_BIN" | grep -E "$PATTERN"
          echo ""
          echo "=== Client.debug.dylib: $CLIENT_DYLIB ==="
          [ -f "$CLIENT_DYLIB" ] && nm -gU "$CLIENT_DYLIB" | grep -E "$PATTERN"
        } > symbol_inspection.log 2>&1
        cat symbol_inspection.log

    - name: Upload symbol inspection log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: symbol-inspection-log
        path: symbol_inspection.log

    - name: Publish Test Report
      if: always()
      uses: mikepenz/action-junit-report@v5
      with:
        report_paths: '**/test_output/xml/report.junit'
        github_token: ${{ inputs.github-token }}
        check_name: 'iOS Unit Test Results'
        require_tests: true
        include_passed: false
        detailed_summary: true
        job_summary: true
        fail_on_failure: true

    - name: Fail job when xcodebuild reported test failures
      if: always() && env.TEST_EXIT_CODE != '0'
      shell: bash
      run: |
        echo "xcodebuild test-without-building exited with status $TEST_EXIT_CODE"
        exit 1
