name: Trigger GitHub Release on Version Bump

# MARKETING_VERSION in EcosiaCommon.xcconfig is bumped for every release (see
# the comment on that line), so treat a push to main that changes it as the
# signal to create a GitHub Release. Let create_github_release.yml's own
# fallback resolve the tag (the latest v_<version>_<build> tag); if it ever
# picks the wrong one, run it manually with an explicit tag instead.
on:
  push:
    branches: [main]
    paths:
      - 'firefox-ios/Client/Ecosia/BuildSettingsConfigurations/EcosiaCommon.xcconfig'

permissions: {}

jobs:
  create_release:
    permissions:
      contents: write
    uses: ./.github/workflows/create_github_release.yml
