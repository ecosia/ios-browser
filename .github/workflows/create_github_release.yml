name: Create GitHub Release

# Run manually once a build has actually been released to the App Store —
# not automatically on tag push, since a tag is created for every successful
# TestFlight upload and some of those never make it to an actual release
# (e.g. superseded by a follow-up patch version).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v_12.5.1_3324). Defaults to the most recent v_<version>_<build> tag if omitted.'
        required: false
        type: string

permissions: {}

jobs:
  create_github_release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            TAG=$(git tag -l 'v_*' | sort -V | tail -1)
            if [[ -z "$TAG" ]]; then
              echo "No tag provided and no v_<version>_<build> tags found in the repo" >&2
              exit 1
            fi
            echo "No tag provided, defaulting to latest tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Parse title from tag
        id: parse
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v_([0-9.]+)_([0-9]+)$ ]]; then
            echo "Tag '$TAG' does not match expected pattern v_<version>_<build>" >&2
            exit 1
          fi
          echo "title=${BASH_REMATCH[1]} (${BASH_REMATCH[2]})" >> "$GITHUB_OUTPUT"

      - name: Create release if not already created
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          TITLE: ${{ steps.parse.outputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --verify-tag \
            --generate-notes
