name: Snapshot Tests

on:
  pull_request:
    branches: [main, 'upgrade/firefox']
  # Pull requests only restore compilation caches, so main refreshes its own cache overnight.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# A new push to a pull request makes its running snapshot tests outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_snapshot_changes:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Check Snapshot Test Relevance
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.classify.outputs.should_run || steps.main_cache.outputs.should_run }}

    steps:
      # Matches the week and commit parts of the cache key. The toolchain part needs macOS to compute,
      # but Xcode is pinned in prepare_environment, so a new version arrives with a new commit, and
      # the weekly refresh bounds how long an unannounced runner image change can go unnoticed.
      - name: Check for a main cache at the latest commit this week
        id: main_cache
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keys=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&key=xcode-compilation-snapshot-tests-&per_page=100" \
            --jq '.actions_caches[].key')
          week=$(date -u +%G-%V)
          should_run=true
          if grep -q -- "-$week-$GITHUB_SHA\$" <<< "$keys"; then
            should_run=false
            echo "main already has a cache for this week and commit; skipping snapshot tests."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          should_run=$(./check_snapshot_updates.sh \
            --should-run \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  execute_snapshot_tests:
    needs: classify_snapshot_changes
    if: >-
      always() &&
      (
        needs.classify_snapshot_changes.result != 'success' ||
        needs.classify_snapshot_changes.outputs.should_run == 'true'
      )
    runs-on: macos-26
    name: Execute Snapshot Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          # Keep GITHUB_TOKEN out of .git/config, where later steps could read it.
          persist-credentials: false

      # GITHUB_TOKEN can only read this repository, so the private SnapshotArtifacts submodule is
      # fetched with a read-only deploy key registered on ecosia/ios-snapshot-tests-files.
      - name: Checkout snapshot artifacts
        env:
          DEPLOY_KEY: ${{ secrets.SNAPSHOT_ARTIFACTS_DEPLOY_KEY }}
          # Unauthenticated API calls share a per-IP rate limit with other jobs on the same runner.
          GH_TOKEN: ${{ github.token }}
        run: |
          ssh_dir="$RUNNER_TEMP/snapshot-artifacts-ssh"
          mkdir -p "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          if [ ! -s "$ssh_dir/known_hosts" ]; then
            echo "Could not fetch GitHub's SSH host keys"
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          git submodule update --init --depth=1 firefox-ios/EcosiaTests/SnapshotTests/SnapshotArtifacts
          git -C firefox-ios/EcosiaTests/SnapshotTests/SnapshotArtifacts lfs pull
          lfs_files=$(git -C firefox-ios/EcosiaTests/SnapshotTests/SnapshotArtifacts lfs ls-files)
          if grep -q ' - ' <<< "$lfs_files"; then
            echo "Some snapshot references are still Git LFS pointers"
            exit 1
          fi

      - uses: ./.github/actions/setup-safe-chain

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          core-token: ${{ secrets.IOS_CORE_TOKEN }}

      - name: Xcode compilation cache
        uses: ./.github/actions/xcode_compilation_cache
        with:
          cache-name: snapshot-tests

      - name: Perform Snapshot Tests and Publish Test reports
        id: perform-snapshot-tests
        uses: ./.github/actions/perform_snapshot_tests
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
