name: Snapshot Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'firefox-ios/Client/Ecosia/BuildSettingsConfigurations/EcosiaCommon.xcconfig'
      - '.github/workflows/snapshot_tests.yml'

jobs:
  execute_snapshot_tests:
    runs-on: macos-26
    name: Execute Snapshot Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          # Keep GITHUB_TOKEN out of .git/config, where later steps could read it.
          persist-credentials: false

      # GITHUB_TOKEN can only read this repository, so the private SnapshotArtifacts submodule is
      # fetched with a read-only deploy key registered on ecosia/ios-snapshot-tests-files.
      - name: Checkout snapshot artifacts
        env:
          DEPLOY_KEY: ${{ secrets.SNAPSHOT_ARTIFACTS_DEPLOY_KEY }}
        run: |
          ssh_dir="$RUNNER_TEMP/snapshot-artifacts-ssh"
          mkdir -p "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          curl -fsSL --retry 3 https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          git submodule update --init --depth=1 firefox-ios/EcosiaTests/SnapshotTests/SnapshotArtifacts
          git -C firefox-ios/EcosiaTests/SnapshotTests/SnapshotArtifacts lfs pull
          if git -C firefox-ios/EcosiaTests/SnapshotTests/SnapshotArtifacts lfs ls-files | grep -q ' - '; then
            echo "Some snapshot references are still Git LFS pointers"
            exit 1
          fi

      - uses: ./.github/actions/setup-safe-chain

      - name: Check for MARKETING_VERSION change
        id: check_marketing_version
        run: sh ./check_marketing_version.sh

      - name: Prepare environment
        if : ( steps.check_marketing_version.outputs.skipnext  != 'true' )
        uses: ./.github/actions/prepare_environment
        with:
          core-token: ${{ secrets.IOS_CORE_TOKEN }}

      - name: Perform Snapshot Tests and Publish Test reports
        if : ( steps.check_marketing_version.outputs.skipnext  != 'true' )
        id: perform-snapshot-tests
        uses: ./.github/actions/perform_snapshot_tests
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
