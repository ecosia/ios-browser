name: Snapshot Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'firefox-ios/Client/Ecosia/BuildSettingsConfigurations/EcosiaCommon.xcconfig'
  push:
    branches: [dc-mob-4907-xcode-compilation-cache]
  workflow_dispatch:

jobs:
  execute_snapshot_tests:
    runs-on: macos-26
    name: Execute Snapshot Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: true
          # Keep GITHUB_TOKEN out of .git/config, where later steps could read it.
          # LFS and submodules are fetched by this step, while it still has auth.
          persist-credentials: false

      - uses: ./.github/actions/setup-safe-chain

      - name: Check for MARKETING_VERSION change
        if: github.event_name == 'pull_request'
        id: check_marketing_version
        run: sh ./check_marketing_version.sh

      - name: Prepare environment
        if: github.event_name != 'pull_request' || steps.check_marketing_version.outputs.skipnext != 'true'
        uses: ./.github/actions/prepare_environment
        with:
          core-token: ${{ secrets.IOS_CORE_TOKEN }}

      - name: Identify Xcode compilation cache generation
        if: github.event_name != 'pull_request' || steps.check_marketing_version.outputs.skipnext != 'true'
        id: xcode-compilation-cache
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode compilation cache
        if: github.event_name != 'pull_request' || steps.check_marketing_version.outputs.skipnext != 'true'
        uses: actions/cache@v4
        with:
          path: DerivedData/CompilationCache.noindex
          key: xcode-compilation-snapshot-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-compilation-cache.outputs.toolchain }}-${{ steps.xcode-compilation-cache.outputs.week }}
          restore-keys: |
            xcode-compilation-snapshot-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-compilation-cache.outputs.toolchain }}-

      - name: Perform Snapshot Tests and Publish Test reports
        if: github.event_name != 'pull_request' || steps.check_marketing_version.outputs.skipnext != 'true'
        id: perform-snapshot-tests
        uses: ./.github/actions/perform_snapshot_tests
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
