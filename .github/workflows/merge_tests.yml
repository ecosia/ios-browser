name: Merge Unit Tests

# Re-enabled (MOB-4384): the unit-test suite is stable again after the v147 upgrade.
#
# Background — MOB-4320 (PR #1112) fixed Swift 6 compilation; MOB-4384 then stabilised the suite:
# all six gated targets (ClientTests, EcosiaTests, StorageTests, SyncTests, SharedTests,
# SyncTelemetryTests) now run with 0 crashes and 0 failures in a single full-scheme invocation
# on iPhone 17 / iOS 26.5. ClientTests' crash count went 228 → 0; every crash was root-caused to a
# real bug (cross-test Places DB isolation, iOS 26.5 WebKit-mock instantiation, MainActor.assumeIsolated
# on background completions, a MockTabManager URLRequest! protocol-mismatch infinite recursion, a
# BookmarksViewController deinit weak-ref, autofill DB writes, AppInfo bundle host, telemetry DI), not
# bent to pass. Legitimate skips are documented inline in Schemes+Ecosia.swift (Firefox-only features and
# the not-yet-shipped wallpaper-header feature).
on:
  pull_request:
    branches: [main, 'patch/**', 'develop']
    # No paths-ignore: a workflow that never starts leaves a required "Execute Merge Tests" check
    # pending forever, while a skipped job counts as passing. Irrelevant changes are skipped in
    # classify_changes instead.
  # Pull requests only restore compilation caches, so main refreshes its own cache overnight.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# A new push to a pull request makes its running merge tests outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_changes:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Check Merge Test Relevance
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.classify.outputs.should_run || steps.main_cache.outputs.should_run }}

    steps:
      # Matches the week and commit parts of the cache key. The toolchain part needs macOS to compute,
      # but Xcode is pinned in prepare_environment, so a new version arrives with a new commit, and
      # the weekly refresh bounds how long an unannounced runner image change can go unnoticed.
      - name: Check for a main cache at the latest commit this week
        id: main_cache
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keys=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&key=xcode-compilation-unit-tests-&per_page=100" \
            --jq '.actions_caches[].key')
          week=$(date -u +%G-%V)
          should_run=true
          if grep -q -- "-$week-$GITHUB_SHA\$" <<< "$keys"; then
            should_run=false
            echo "main already has a cache for this week and commit; skipping merge tests."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      # paths-ignore can only skip whole files, and EcosiaCommon.xcconfig also holds build settings
      # that do need tests, so version bumps are detected line by line instead.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          xcconfig=firefox-ios/Client/Ecosia/BuildSettingsConfigurations/EcosiaCommon.xcconfig
          changed_files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")

          # Files the unit tests never read: docs, snapshot-test tooling, and workflows other than
          # this one (its own changes must be tested).
          needs_tests() {
            case "$1" in
              .github/workflows/merge_tests.yml) return 0 ;;
              *.md | .cursor/* | .github/ISSUE_TEMPLATE/* | .github/actions/perform_snapshot_tests/* | \
              .github/workflows/* | firefox-ios/Ecosia/Ecosia.docc/* | firefox-ios/EcosiaTests/SnapshotTests/* | \
              check_snapshot_updates.sh | generate_snapshot_coverage_docs.sh | perform_snapshot_tests.sh | \
              CODEOWNERS) return 1 ;;
              *) return 0 ;;
            esac
          }

          relevant=""
          while IFS= read -r file; do
            if [ -n "$file" ] && needs_tests "$file"; then relevant=$file; break; fi
          done <<< "$changed_files"

          should_run=true
          if [ -z "$relevant" ]; then
            should_run=false
            echo "Only docs, snapshot tooling or other workflows changed; skipping merge tests."
          elif [ "$changed_files" = "$xcconfig" ] &&
             .github/scripts/only_marketing_version_changed.sh "$BASE_SHA" "$HEAD_SHA"; then
            should_run=false
            echo "Only MARKETING_VERSION changed; skipping merge tests."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  execute_merge_tests:
    needs: classify_changes
    if: >-
      always() &&
      (
        needs.classify_changes.result != 'success' ||
        needs.classify_changes.outputs.should_run == 'true'
      )
    runs-on: macos-26-xlarge
    name: Execute Merge Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Keep GITHUB_TOKEN out of .git/config, where later steps could read it.
          persist-credentials: false

      - uses: ./.github/actions/setup-safe-chain

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          core-token: ${{ secrets.IOS_CORE_TOKEN }}

      - name: Xcode compilation cache
        uses: ./.github/actions/xcode_compilation_cache
        with:
          cache-name: unit-tests

      - name: Perform Unit Tests and Publish Test reports
        id: perform-tests
        uses: ./.github/actions/perform_unit_tests
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
